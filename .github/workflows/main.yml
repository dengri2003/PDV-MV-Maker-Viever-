name: Build Release APK (RuStore)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Generate temporary debug keystore if gradle expects it
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign Release APK
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > release.jks
          APK_IN=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_IN" app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:${{ secrets.RELEASE_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.RELEASE_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --out app-release-signed.apk \
            app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs app-release-signed.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v7
        with:
          name: PDFMV-release-apk
          path: app-release-signed.apk
