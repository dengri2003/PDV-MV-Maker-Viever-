name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate release keystore and Base64
        env:
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASS" ]; then
            echo "Error: Сначала создайте секреты RELEASE_KEY_ALIAS и RELEASE_STORE_PASSWORD!"
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=KinoCut, O=Developer, C=RU"
          base64 -w 0 release.jks > release_base64.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v7
        with:
          name: android-release-keystore
          path: |
            release.jks
            release_base64.txt
